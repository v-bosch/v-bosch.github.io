<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reading chronology</title>
  <script>
    (() => {
      const stored = localStorage.getItem('theme');
      const dark = stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --paper: #f3eee4;
      --ink: #2f2a24;
      --muted: #7e7468;
      --hairline: rgba(65, 51, 39, .18);
      --glow: rgba(255,255,255,.42);
      --ring-line: rgba(66, 44, 29, .48);
      --plot-shadow: drop-shadow(0 18px 24px rgba(61, 43, 28, .08));
      --tooltip-bg: rgba(250, 247, 239, .96);
      --tooltip-border: rgba(65, 51, 39, .14);
      --tooltip-shadow: 0 12px 30px rgba(48, 34, 23, .12);
      --focus: #76533d;
      --scale-gradient: linear-gradient(90deg, #d7dfc0, #6bad8f, #2c1e3e);
      --current-color: #3d577a;
      --read-color: #2c1e3e;
      --pith-color: #d7dfc0;
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --paper: #1c1c1d;
      --ink: #e8e5df;
      --muted: #aaa49b;
      --hairline: rgba(232, 229, 223, .16);
      --glow: rgba(90, 103, 216, .07);
      --ring-line: rgba(232, 229, 223, .27);
      --plot-shadow: drop-shadow(0 18px 28px rgba(0, 0, 0, .2));
      --tooltip-bg: rgba(33, 37, 41, .97);
      --tooltip-border: rgba(232, 229, 223, .16);
      --tooltip-shadow: 0 12px 30px rgba(0, 0, 0, .28);
      --focus: #9fa8ff;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      background:
        radial-gradient(circle at 48% 40%, var(--glow), transparent 34rem),
        var(--paper);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-rendering: optimizeLegibility;
    }

    button { font: inherit; }

    .shell {
      width: min(1180px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: clamp(24px, 5vw, 64px);
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(210px, 280px);
      gap: clamp(28px, 6vw, 84px);
      align-items: center;
    }

    .visual { min-width: 0; }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(40px, 7vw, 76px);
      font-weight: 400;
      letter-spacing: -.04em;
      line-height: .95;
    }

    .subhead {
      max-width: 33rem;
      margin: 14px 0 0;
      color: var(--muted);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 16px;
      font-style: italic;
      line-height: 1.45;
    }

    .plot-wrap {
      position: relative;
      width: min(100%, 720px);
      margin: 22px auto 0;
      aspect-ratio: 1;
    }

    svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: var(--plot-shadow);
    }

    .segment {
      cursor: crosshair;
      stroke: none;
      transition: opacity 180ms ease, filter 180ms ease;
    }

    .ring.is-dimmed .segment,
    .ring.is-dimmed .book-mark { opacity: .14; }

    .ring:hover .segment,
    .ring.is-selected .segment { filter: saturate(1.12) contrast(1.04); }

    .boundary {
      fill: none;
      stroke: var(--ring-line);
      stroke-width: .75;
      pointer-events: none;
      vector-effect: non-scaling-stroke;
    }

    .book-mark {
      fill: none;
      stroke: var(--read-color);
      stroke-width: 1.35;
      stroke-linecap: round;
      opacity: .78;
      pointer-events: none;
      transition: stroke-width 120ms ease, opacity 180ms ease, stroke 180ms ease;
      vector-effect: non-scaling-stroke;
    }

    .book-hit { fill: transparent; cursor: pointer; }
    .book-hit:hover + .book-mark,
    .book-hit:focus + .book-mark { stroke-width: 2.4; opacity: 1; }

    .pith {
      fill: var(--pith-color);
      opacity: .48;
      stroke: none;
      pointer-events: none;
      transition: fill 180ms ease;
    }

    html[data-theme="dark"] .pith { opacity: .62; }

    .current-trace {
      fill: none;
      stroke: var(--current-color);
      stroke-width: 1.35;
      stroke-linecap: round;
      pointer-events: none;
      transition: opacity 180ms ease, stroke 180ms ease;
      vector-effect: non-scaling-stroke;
    }

    .current-hit {
      fill: none;
      stroke: transparent;
      stroke-width: 8;
      cursor: pointer;
      vector-effect: non-scaling-stroke;
    }

    .current-mark {
      fill: var(--paper);
      stroke: var(--current-color);
      stroke-width: 1.15;
      pointer-events: none;
      transition: opacity 180ms ease, stroke 180ms ease;
      vector-effect: non-scaling-stroke;
    }

    .ring.is-dimmed .current-trace,
    .ring.is-dimmed .current-mark { opacity: .06 !important; }

    .tooltip {
      position: fixed;
      z-index: 10;
      width: max-content;
      max-width: min(290px, calc(100vw - 28px));
      padding: 10px 12px;
      border: 1px solid var(--tooltip-border);
      background: var(--tooltip-bg);
      box-shadow: var(--tooltip-shadow);
      pointer-events: none;
      opacity: 0;
      transform: translate(10px, 10px);
      transition: opacity 100ms ease;
    }

    .tooltip.show { opacity: 1; }
    .tooltip strong { display: block; font-family: Georgia, serif; font-size: 15px; font-weight: 400; }
    .tooltip span { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; line-height: 1.35; }

    aside {
      align-self: center;
      padding-top: 7vh;
    }

    .years {
      display: flex;
      flex-wrap: wrap;
      gap: 5px 13px;
      margin: 0 0 32px;
    }

    .palette-controls {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin: 0 0 14px;
    }

    .palette-label {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    .palette-button {
      padding: 2px 0;
      border: 0;
      border-bottom: 1px solid transparent;
      background: none;
      color: var(--muted);
      font-family: Georgia, serif;
      font-size: 12px;
      font-style: italic;
      cursor: pointer;
    }

    .palette-button:hover,
    .palette-button:focus-visible,
    .palette-button[aria-pressed="true"] {
      border-bottom-color: currentColor;
      color: var(--ink);
      outline: none;
    }

    .year-button {
      padding: 3px 0;
      border: 0;
      border-bottom: 1px solid transparent;
      background: none;
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
    }

    .year-button:hover,
    .year-button:focus-visible,
    .year-button[aria-pressed="true"] {
      border-bottom-color: currentColor;
      color: var(--ink);
      outline: none;
    }

    .year-detail {
      min-height: 116px;
      padding: 18px 0;
      border-top: 1px solid var(--hairline);
      border-bottom: 1px solid var(--hairline);
    }

    .detail-year {
      margin: 0;
      font-family: Georgia, serif;
      font-size: 30px;
      font-weight: 400;
    }

    .detail-main { margin: 7px 0 0; font-size: 13px; line-height: 1.5; }
    .detail-note { margin: 4px 0 0; color: var(--muted); font-size: 11px; line-height: 1.45; }

    .status {
      margin-top: 27px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.65;
    }

    .status strong { color: var(--ink); font-weight: 500; }

    .scale {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-top: 21px;
      color: var(--muted);
      font-size: 10px;
    }

    .current-key {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 10px;
    }

    .current-sample {
      width: 94px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--current-color));
    }

    .scale-bar {
      width: 94px;
      height: 7px;
      background: var(--scale-gradient);
      border: 1px solid rgba(65, 51, 39, .12);
    }

    .error {
      max-width: 34rem;
      margin: 42px 0;
      padding: 15px 0;
      border-top: 1px solid var(--hairline);
      border-bottom: 1px solid var(--hairline);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    @media (max-width: 760px) {
      .shell { grid-template-columns: 1fr; align-items: start; }
      aside { padding-top: 0; }
      .plot-wrap { margin-top: 12px; }
      .years { margin-bottom: 18px; }
      .year-detail { min-height: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="shell" id="strataApp">
    <section class="visual" aria-labelledby="title">
      <p class="eyebrow">Reading record · 2021–2026</p>
      <!--<h1 id="title">Strata</h1>-->
      <!--<p class="subhead">Each contour is a year. Its thickness and colour follow the density of dated completions through the seasons.</p>-->
      <div class="plot-wrap" id="plotWrap">
        <svg id="plot" viewBox="120 120 460 460" role="img" aria-labelledby="plotTitle plotDesc">
          <!--<title id="plotTitle">Irregular tree rings representing books read by year</title>-->
          <!--<desc id="plotDesc">Each ring is one year. Thicker, darker sections show periods with more dated book completions. Small pale marks represent individual books.</desc>-->
        </svg>
      </div>
      <div class="error" id="error" hidden></div>
    </section>

    <aside aria-label="Reading chronology controls and details">
      <div class="palette-controls" aria-label="Colour palette">
        <span class="palette-label">palette</span>
        <button type="button" class="palette-button" data-palette="warm" aria-pressed="true">forest</button>
        <button type="button" class="palette-button" data-palette="classic" aria-pressed="false">rose</button>
      </div>
      <div class="years" id="yearControls"></div>
      <div class="year-detail" aria-live="polite">
        <p class="detail-year" id="detailYear">All years</p>
        <p class="detail-main" id="detailMain">Loading the reading record…</p>
        <p class="detail-note" id="detailNote"></p>
      </div>
      <div class="scale" aria-label="Reading density colour scale">
        <span>quiet</span><span class="scale-bar"></span><span>dense</span>
      </div>
      <div class="current-key" aria-label="Currently reading trace">
        <span>ongoing</span><span class="current-sample"></span><span>today</span>
      </div>
      <div class="status" id="status"></div>
    </aside>
  </main>
  <div class="tooltip" id="tooltip" role="tooltip"></div>

  <script>
    (() => {
      const themePreference = window.matchMedia('(prefers-color-scheme: dark)');
      function syncTheme(value = localStorage.getItem('theme')) {
        const dark = value === 'dark' || (!value && themePreference.matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      }
      window.addEventListener('storage', event => {
        if (event.key === 'theme') syncTheme(event.newValue);
      });
      themePreference.addEventListener?.('change', () => {
        if (!localStorage.getItem('theme')) syncTheme();
      });

      const DATA_URL = 'files/books.csv';
      const svg = document.getElementById('plot');
      const tooltip = document.getElementById('tooltip');
      const controls = document.getElementById('yearControls');
      const detailYear = document.getElementById('detailYear');
      const detailMain = document.getElementById('detailMain');
      const detailNote = document.getElementById('detailNote');
      const status = document.getElementById('status');
      const error = document.getElementById('error');
      const NS = 'http://www.w3.org/2000/svg';
      const CX = 347;
      const CY = 351;
      const STEPS = 180;
      const TAU = Math.PI * 2;
      let selectedYear = null;
      let selectedPalette = 'warm';
      let dated = [];
      let currentBooks = [];
      let groups = [];

      const palettes = {
        classic: ['#edd1cb','#e3b5b7','#d499a7','#c27f9a','#aa688f','#8d5282','#6e4071','#4c2e5a','#2d1e3e'],
        warm: ['#d7dfc0','#b3d1a5','#8cc195','#6bad8f','#53958d','#447688','#3d577a','#373860','#2c1e3e']
      };

      function parseCSV(text) {
        const rows = [];
        let row = [];
        let field = '';
        let quoted = false;
        for (let i = 0; i < text.length; i++) {
          const ch = text[i];
          if (quoted) {
            if (ch === '"' && text[i + 1] === '"') { field += '"'; i++; }
            else if (ch === '"') quoted = false;
            else field += ch;
          } else if (ch === '"') quoted = true;
          else if (ch === ',') { row.push(field); field = ''; }
          else if (ch === '\n') { row.push(field.replace(/\r$/, '')); rows.push(row); row = []; field = ''; }
          else field += ch;
        }
        if (field.length || row.length) { row.push(field); rows.push(row); }
        const headers = rows.shift();
        return rows.filter(r => r.some(Boolean)).map(values =>
          Object.fromEntries(headers.map((header, i) => [header, values[i] || '']))
        );
      }

      function svgEl(name, attrs = {}) {
        const el = document.createElementNS(NS, name);
        for (const [key, value] of Object.entries(attrs)) el.setAttribute(key, value);
        return el;
      }

      function dayOfYear(date) {
        const start = Date.UTC(date.getUTCFullYear(), 0, 0);
        return Math.floor((date.getTime() - start) / 86400000);
      }

      function seededNoise(theta, seed) {
        return Math.sin(theta * 2 + seed * 1.17) * 2.8
          + Math.sin(theta * 5 - seed * .73) * 1.8
          + Math.sin(theta * 9 + seed * 2.21) * .85
          + Math.sin(theta * 17 - seed * .37) * .32;
      }

      function wrappedDistance(a, b) {
        const d = Math.abs(a - b);
        return Math.min(d, 365 - d);
      }

      function densityFor(group, day) {
        return group.books.reduce((sum, book) => {
          const d = wrappedDistance(day, book.day);
          return sum + Math.exp(-(d * d) / (2 * 14 * 14));
        }, 0);
      }

      function point(radius, theta) {
        return [CX + Math.cos(theta) * radius, CY + Math.sin(theta) * radius];
      }

      function closedPath(points) {
        return `M${points.map(p => p.map(v => v.toFixed(2)).join(',')).join('L')}Z`;
      }

      function linePath(points) {
        return `M${points.map(p => p.map(v => v.toFixed(2)).join(',')).join('L')}Z`;
      }

      function openLinePath(points) {
        return `M${points.map(p => p.map(v => v.toFixed(2)).join(',')).join('L')}`;
      }

      function hexToRGB(hex) {
        return [1, 3, 5].map(index => parseInt(hex.slice(index, index + 2), 16));
      }

      function mixColor(t) {
        const clamped = Math.max(0, Math.min(1, t));
        const palette = palettes[selectedPalette];
        const position = clamped * (palette.length - 1);
        const index = Math.min(palette.length - 2, Math.floor(position));
        const local = position - index;
        const a = hexToRGB(palette[index]);
        const b = hexToRGB(palette[index + 1]);
        const rgb = a.map((v, channel) => Math.round(v + (b[channel] - v) * local));
        return `rgb(${rgb.join(',')})`;
      }

      function applyPalette(name) {
        selectedPalette = name;
        document.querySelectorAll('.segment').forEach(segment => {
          segment.setAttribute('fill', mixColor(Number(segment.dataset.density)));
        });
        document.querySelectorAll('.palette-button').forEach(button => {
          button.setAttribute('aria-pressed', String(button.dataset.palette === name));
        });
        const palette = palettes[name];
        document.documentElement.style.setProperty('--scale-gradient', `linear-gradient(90deg, ${palette[0]}, ${palette[4]}, ${palette[8]})`);
        document.documentElement.style.setProperty('--current-color', palette[6]);
        document.documentElement.style.setProperty('--read-color', palette[8]);
        document.documentElement.style.setProperty('--pith-color', palette[0]);
      }

      function showTooltip(event, book) {
        const pages = book.pages ? `${book.pages} pages` : 'page count unavailable';
        tooltip.innerHTML = `<strong>${escapeHTML(book.title)}</strong><span>${escapeHTML(book.author)}<br>${book.dateLabel} · ${pages}</span>`;
        tooltip.classList.add('show');
        moveTooltip(event);
      }

      function moveTooltip(event) {
        const pad = 14;
        let x = event.clientX + 12;
        let y = event.clientY + 12;
        const box = tooltip.getBoundingClientRect();
        if (x + box.width > window.innerWidth - pad) x = event.clientX - box.width - 12;
        if (y + box.height > window.innerHeight - pad) y = event.clientY - box.height - 12;
        tooltip.style.left = `${Math.max(pad, x)}px`;
        tooltip.style.top = `${Math.max(pad, y)}px`;
      }

      function hideTooltip() { tooltip.classList.remove('show'); }
      function escapeHTML(value) {
        return value.replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
      }

      function selectYear(year) {
        selectedYear = year;
        document.querySelectorAll('.ring').forEach(ring => {
          const ringValue = ring.dataset.year === 'current' ? 'current' : Number(ring.dataset.year);
          const active = year === null || ringValue === year;
          ring.classList.toggle('is-dimmed', !active);
          ring.classList.toggle('is-selected', year !== null && active);
        });
        document.querySelectorAll('.year-button').forEach(button => {
          const value = button.dataset.year === 'all' ? null : (button.dataset.year === 'current' ? 'current' : Number(button.dataset.year));
          button.setAttribute('aria-pressed', String(value === year));
        });
        updateDetails(year);
      }

      function updateDetails(year) {
        if (year === 'current') {
          const pages = currentBooks.reduce((sum, book) => sum + (book.pages || 0), 0);
          detailYear.textContent = 'Now';
          detailMain.textContent = `${currentBooks.length} books currently reading · ${pages.toLocaleString()} recorded pages`;
          detailNote.textContent = 'Parallel traces end at today; their length marks ongoing status, not reading duration.';
          return;
        }
        const books = year === null ? dated : dated.filter(book => book.year === year);
        const pages = books.reduce((sum, book) => sum + (book.pages || 0), 0);
        detailYear.textContent = year === null ? 'All years' : String(year);
        detailMain.textContent = `${books.length} dated completion${books.length === 1 ? '' : 's'} · ${pages.toLocaleString()} recorded pages`;
        detailNote.textContent = year === null ? `${currentBooks.length} currently reading` : '';
      }

      function render(allRows) {
        dated = allRows.filter(row => row['Date Read']).map(row => {
          const [year, month, day] = row['Date Read'].split('/').map(Number);
          const date = new Date(Date.UTC(year, month - 1, day));
          return {
            id: row['Book Id'],
            title: row['Title'],
            author: row['Author'],
            year,
            day: dayOfYear(date),
            dateLabel: new Intl.DateTimeFormat('en', {day:'numeric', month:'short', year:'numeric', timeZone:'UTC'}).format(date),
            pages: Number(row['Number of Pages']) || 0
          };
        }).sort((a, b) => a.year - b.year || a.day - b.day || a.title.localeCompare(b.title));

        groups = [...new Set(dated.map(book => book.year))].map(year => ({
          year,
          books: dated.filter(book => book.year === year)
        }));

        currentBooks = allRows.filter(row => row['Exclusive Shelf'] === 'currently-reading').map(row => {
          const addedParts = row['Date Added'].split('/').map(Number);
          const addedDate = addedParts.length === 3 ? new Date(Date.UTC(addedParts[0], addedParts[1] - 1, addedParts[2])) : null;
          const addedLabel = addedDate
            ? new Intl.DateTimeFormat('en', {day:'numeric', month:'short', year:'numeric', timeZone:'UTC'}).format(addedDate)
            : 'date unknown';
          return {
            id: row['Book Id'],
            title: row['Title'],
            author: row['Author'],
            pages: Number(row['Number of Pages']) || 0,
            dateLabel: `Currently reading · added ${addedLabel}`
          };
        }).sort((a, b) => a.title.localeCompare(b.title));

        const shelfCounts = allRows.reduce((counts, row) => {
          const shelf = row['Exclusive Shelf'] || 'unshelved';
          counts[shelf] = (counts[shelf] || 0) + 1;
          return counts;
        }, {});
        const undatedRead = allRows.filter(row => row['Exclusive Shelf'] === 'read' && !row['Date Read']).length;

        status.innerHTML = `<strong>${allRows.length}</strong> books in the library<br>`
          + `${shelfCounts.read || 0} read · ${shelfCounts['currently-reading'] || 0} current · ${shelfCounts['to-read'] || 0} to read`
          + `<br><br>${undatedRead} read books have no completion date and are not placed in the rings.`;

        controls.replaceChildren();
        const choices = [{label: 'All', value: null}, ...groups.map(group => ({label: String(group.year), value: group.year})), {label: 'Now', value: 'current'}];
        choices.forEach(choice => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'year-button';
          button.textContent = choice.label;
          button.dataset.year = choice.value === null ? 'all' : String(choice.value);
          button.setAttribute('aria-pressed', String(choice.value === null));
          button.addEventListener('click', () => selectYear(choice.value));
          controls.append(button);
        });

        const priorTitle = svg.querySelector('title').cloneNode(true);
        const priorDesc = svg.querySelector('desc').cloneNode(true);
        svg.replaceChildren(priorTitle, priorDesc);

        const pithPoints = [];
        let innerRadii = [];
        for (let i = 0; i < STEPS; i++) {
          const theta = i / STEPS * TAU - Math.PI / 2;
          const radius = 30
            + seededNoise(theta, 1) * 1.08
            + Math.sin(theta * 3 + .8) * 1.25;
          innerRadii.push(radius);
          pithPoints.push([
            CX - 3.5 + Math.cos(theta) * radius,
            CY + 1.5 + Math.sin(theta) * radius
          ]);
        }
        svg.append(svgEl('path', {d: closedPath(pithPoints), class: 'pith'}));

        groups.forEach((group, ringIndex) => {
          const layer = svgEl('g', {class: 'ring', 'data-year': group.year, tabindex: '0', role: 'button', 'aria-label': `${group.year}: ${group.books.length} dated completions`});
          const densities = [];
          for (let i = 0; i < STEPS; i++) {
            const day = i / STEPS * 365;
            densities.push(densityFor(group, day));
          }
          const maxDensity = Math.max(...densities, .0001);
          const annualWidth = 8.5 + Math.sqrt(group.books.length) * 2.45;
          const outerRadii = innerRadii.map((inner, i) => {
            const theta = i / STEPS * TAU - Math.PI / 2;
            const local = densities[i] / maxDensity;
            const organic = seededNoise(theta, ringIndex + 3) * .36;
            return inner + annualWidth + local * 8.5 + organic;
          });

          for (let i = 0; i < STEPS; i++) {
            const next = (i + 1) % STEPS;
            const t1 = i / STEPS * TAU - Math.PI / 2;
            const t2 = next / STEPS * TAU - Math.PI / 2;
            const points = [point(innerRadii[i], t1), point(outerRadii[i], t1), point(outerRadii[next], t2), point(innerRadii[next], t2)];
            const local = (densities[i] + densities[next]) / (2 * maxDensity);
            const densityValue = .12 + local * .88;
            const segment = svgEl('path', {d: closedPath(points), class: 'segment', fill: mixColor(densityValue), 'data-density': densityValue.toFixed(4)});
            segment.addEventListener('click', () => selectYear(group.year));
            layer.append(segment);
          }

          const boundaryPoints = outerRadii.map((radius, i) => point(radius, i / STEPS * TAU - Math.PI / 2));
          layer.append(svgEl('path', {d: linePath(boundaryPoints), class: 'boundary'}));

          group.books.forEach(book => {
            const progress = (book.day - 1) / 365;
            const theta = progress * TAU - Math.PI / 2;
            const index = Math.round(progress * STEPS) % STEPS;
            const radius = innerRadii[index] + (outerRadii[index] - innerRadii[index]) * .56;
            const [x, y] = point(radius, theta);
            const hit = svgEl('circle', {cx: x, cy: y, r: 8, class: 'book-hit', tabindex: '0', 'aria-label': `${book.title} by ${book.author}, completed ${book.dateLabel}`});
            const halfLength = 3.3;
            const tangent = [-Math.sin(theta), Math.cos(theta)];
            const mark = svgEl('path', {
              d: openLinePath([
                [x - tangent[0] * halfLength, y - tangent[1] * halfLength],
                [x + tangent[0] * halfLength, y + tangent[1] * halfLength]
              ]),
              class: 'book-mark'
            });
            [hit, mark].forEach(node => {
              node.addEventListener('pointerenter', event => showTooltip(event, book));
              node.addEventListener('pointermove', moveTooltip);
              node.addEventListener('pointerleave', hideTooltip);
              node.addEventListener('focus', event => {
                const rect = node.getBoundingClientRect();
                showTooltip({clientX: rect.left + rect.width / 2, clientY: rect.top + rect.height / 2}, book);
              });
              node.addEventListener('blur', hideTooltip);
            });
            layer.append(hit, mark);
          });

          layer.addEventListener('keydown', event => {
            if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); selectYear(group.year); }
          });
          svg.append(layer);
          innerRadii = outerRadii;
        });

        if (currentBooks.length && innerRadii.length) {
          const today = new Date();
          const utcToday = new Date(Date.UTC(today.getFullYear(), today.getMonth(), today.getDate()));
          const todayProgress = (dayOfYear(utcToday) - 1) / 365;
          const todayTheta = todayProgress * TAU - Math.PI / 2;
          const traceSpan = 22 / 365 * TAU;
          const currentLayer = svgEl('g', {
            class: 'ring current-group',
            'data-year': 'current',
            tabindex: '0',
            role: 'button',
            'aria-label': `${currentBooks.length} currently reading books ending at today`
          });

          function outerRadiusAt(theta) {
            const progress = (((theta + Math.PI / 2) % TAU) + TAU) % TAU / TAU;
            return innerRadii[Math.round(progress * STEPS) % STEPS];
          }

          currentBooks.forEach((book, bookIndex) => {
            const radialOffset = 7 + bookIndex * 1.65;
            const fullPoints = [];
            for (let step = 0; step <= 16; step++) {
              const theta = todayTheta - traceSpan + traceSpan * step / 16;
              fullPoints.push(point(outerRadiusAt(theta) + radialOffset, theta));
            }

            const opacities = [.13, .26, .48, .82];
            for (let segmentIndex = 0; segmentIndex < 4; segmentIndex++) {
              const segmentPoints = fullPoints.slice(segmentIndex * 4, segmentIndex * 4 + 5);
              currentLayer.append(svgEl('path', {
                d: openLinePath(segmentPoints),
                class: 'current-trace',
                opacity: opacities[segmentIndex]
              }));
            }

            const hit = svgEl('path', {d: openLinePath(fullPoints), class: 'current-hit', tabindex: '0', 'aria-label': `${book.title} by ${book.author}, currently reading`});
            const end = fullPoints[fullPoints.length - 1];
            const mark = svgEl('circle', {cx: end[0], cy: end[1], r: 1.9, class: 'current-mark'});
            hit.addEventListener('pointerenter', event => showTooltip(event, book));
            hit.addEventListener('pointermove', moveTooltip);
            hit.addEventListener('pointerleave', hideTooltip);
            hit.addEventListener('focus', event => {
              const rect = hit.getBoundingClientRect();
              showTooltip({clientX: rect.right, clientY: rect.top + rect.height / 2}, book);
            });
            hit.addEventListener('blur', hideTooltip);
            currentLayer.append(hit, mark);
          });

          currentLayer.addEventListener('click', () => selectYear('current'));
          currentLayer.addEventListener('keydown', event => {
            if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); selectYear('current'); }
          });
          svg.append(currentLayer);
        }

        applyPalette(selectedPalette);
        selectYear(null);
      }

      document.querySelectorAll('.palette-button').forEach(button => {
        button.addEventListener('click', () => applyPalette(button.dataset.palette));
      });

      fetch(DATA_URL)
        .then(response => {
          if (!response.ok) throw new Error(`Could not load the CSV (${response.status}).`);
          return response.text();
        })
        .then(text => render(parseCSV(text.replace(/^\uFEFF/, ''))))
        .catch(cause => {
          error.hidden = false;
          error.textContent = 'The data file could not be loaded. Open this folder through a small local web server, then visit index.html. ' + cause.message;
          document.getElementById('plotWrap').hidden = true;
          detailMain.textContent = 'Data unavailable';
          detailNote.textContent = '';
        });
    })();
  </script>
</body>
</html>
